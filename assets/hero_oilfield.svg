<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustración de un campo petrolero onshore con balancines, tanques de almacenamiento y una plataforma offshore al atardecer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2b4f"/>
      <stop offset="0.45" stop-color="#2f4f7a"/>
      <stop offset="0.75" stop-color="#c9724a"/>
      <stop offset="1" stop-color="#f2b25c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a3"/>
      <stop offset="0.6" stop-color="#f6b24f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f6b24f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b5c80"/>
      <stop offset="1" stop-color="#14304f"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a22"/>
      <stop offset="1" stop-color="#1c1411"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffcf6b"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5a2a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- cielo y sol -->
  <rect width="1400" height="380" fill="url(#sky)"/>
  <circle cx="610" cy="262" r="120" fill="url(#sun)"/>
  <circle cx="610" cy="262" r="46" fill="#ffd98a"/>

  <!-- nubes tenues -->
  <g fill="#ffffff" opacity="0.08">
    <ellipse cx="260" cy="90" rx="160" ry="14"/>
    <ellipse cx="880" cy="60" rx="210" ry="12"/>
    <ellipse cx="1180" cy="120" rx="140" ry="10"/>
  </g>

  <!-- colinas lejanas -->
  <path d="M0 270 C 180 240, 330 255, 470 262 S 760 250, 860 268 L 860 380 L 0 380 Z" fill="#4a3530" opacity="0.65"/>

  <!-- mar a la derecha -->
  <rect x="820" y="262" width="580" height="118" fill="url(#sea)"/>
  <g stroke="#9fb7d1" stroke-width="2" opacity="0.35" stroke-linecap="round">
    <line x1="880" y1="292" x2="930" y2="292"/>
    <line x1="980" y1="310" x2="1050" y2="310"/>
    <line x1="1120" y1="300" x2="1170" y2="300"/>
    <line x1="1230" y1="330" x2="1310" y2="330"/>
    <line x1="900" y1="345" x2="980" y2="345"/>
    <line x1="1060" y1="360" x2="1130" y2="360"/>
  </g>
  <!-- reflejo del sol -->
  <g fill="#ffd98a" opacity="0.35">
    <rect x="590" y="270" width="40" height="3" rx="1.5"/>
  </g>

  <!-- terreno onshore -->
  <path d="M0 292 C 200 282, 420 290, 600 286 S 800 292, 860 296 L 860 380 L 0 380 Z" fill="url(#ground)"/>

  <!-- oleoducto -->
  <g stroke="#151010" stroke-width="5" fill="none">
    <path d="M40 326 L 520 326 L 560 312 L 840 312"/>
  </g>
  <g fill="#151010">
    <rect x="120" y="326" width="4" height="12"/><rect x="240" y="326" width="4" height="12"/>
    <rect x="360" y="326" width="4" height="12"/><rect x="480" y="326" width="4" height="12"/>
    <rect x="640" y="312" width="4" height="14"/><rect x="760" y="312" width="4" height="14"/>
  </g>

  <!-- tanques de almacenamiento -->
  <g fill="#1a1312">
    <rect x="455" y="250" width="70" height="44" rx="3"/>
    <ellipse cx="490" cy="250" rx="35" ry="6"/>
    <rect x="532" y="262" width="54" height="32" rx="3"/>
    <ellipse cx="559" cy="262" rx="27" ry="5"/>
  </g>
  <g stroke="#1a1312" stroke-width="2" fill="none">
    <path d="M505 250 L 505 236 L 520 236"/>
  </g>

  <!-- balancín (pumpjack) grande -->
  <g fill="#120d0c" stroke="#120d0c">
    <polygon points="150,296 196,296 176,214" />
    <rect x="96" y="290" width="160" height="8"/>
    <g transform="rotate(-9 176 214)">
      <rect x="92" y="208" width="186" height="11" rx="2"/>
      <path d="M86 200 Q 72 214 86 236 L 100 236 L 100 200 Z"/>
    </g>
    <line x1="88" y1="232" x2="88" y2="292" stroke-width="3"/>
    <rect x="232" y="258" width="26" height="30" rx="2"/>
    <circle cx="245" cy="262" r="16"/>
    <line x1="245" y1="262" x2="268" y2="226" stroke-width="5"/>
  </g>

  <!-- balancín pequeño (lejano) -->
  <g fill="#1e1614" stroke="#1e1614" opacity="0.9">
    <polygon points="352,290 376,290 366,246"/>
    <rect x="322" y="287" width="84" height="5"/>
    <g transform="rotate(7 366 246)">
      <rect x="318" y="243" width="96" height="6" rx="1"/>
      <path d="M314 238 Q 306 246 314 258 L 322 258 L 322 238 Z"/>
    </g>
    <line x1="316" y1="256" x2="316" y2="289" stroke-width="2"/>
    <circle cx="396" cy="275" r="9"/>
  </g>

  <!-- torre de perforación lejana -->
  <g stroke="#2a1f1c" stroke-width="2.5" fill="none" opacity="0.9">
    <path d="M700 290 L 724 170 L 748 290"/>
    <path d="M706 260 L 742 260 M 711 232 L 737 232 M 716 204 L 732 204"/>
    <path d="M706 260 L 737 232 M 742 260 L 711 232 M 711 232 L 732 204 M 737 232 L 716 204"/>
    <path d="M724 170 L 724 160"/>
  </g>

  <!-- plataforma offshore -->
  <g fill="#0f1e30" stroke="#0f1e30">
    <!-- patas -->
    <path d="M1050 340 L 1066 262 M 1170 340 L 1154 262 M 1095 340 L 1100 262 M 1125 340 L 1120 262" stroke-width="7" fill="none"/>
    <path d="M1060 300 L 1160 300 M 1056 322 L 1164 322" stroke-width="3" fill="none"/>
    <!-- cubierta -->
    <rect x="1036" y="250" width="148" height="14"/>
    <rect x="1048" y="222" width="70" height="28"/>
    <rect x="1124" y="232" width="48" height="18"/>
    <!-- torre -->
    <path d="M1080 222 L 1092 140 L 1104 222 Z" fill="none" stroke-width="3"/>
    <path d="M1084 196 L 1100 196 M 1087 170 L 1097 170" stroke-width="2" fill="none"/>
    <!-- grúa -->
    <path d="M1170 232 L 1170 196 L 1232 178" stroke-width="3" fill="none"/>
    <!-- helipuerto -->
    <rect x="1018" y="244" width="30" height="5"/>
    <!-- antorcha -->
    <path d="M1184 256 L 1244 206" stroke-width="3" fill="none"/>
  </g>
  <path d="M1244 206 C 1236 190, 1240 172, 1250 160 C 1252 176, 1262 182, 1258 198 C 1256 206, 1250 208, 1244 206 Z" fill="url(#flare)"/>
  <!-- reflejo de la plataforma -->
  <rect x="1040" y="342" width="140" height="3" fill="#0f1e30" opacity="0.5"/>

  <!-- buque tanquero lejano -->
  <g fill="#0f1e30" opacity="0.85">
    <path d="M1270 286 L 1380 286 L 1370 298 L 1280 298 Z"/>
    <rect x="1350" y="274" width="16" height="12"/>
  </g>
</svg>
